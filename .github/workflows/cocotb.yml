name: Cocotb

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/cocotb.yml
      - src/**
      - test/**

jobs:
  cocotb:
    name: Cocotb (${{ matrix.name }})
    runs-on: ubuntu-latest
    container:
      image: rafaelcorsi/pl-descomp-cocotb:latest
      options: -v ${{ github.workspace }}:/var/www

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ROM
            toplevel: mips_rom
            module: test_mips_rom
            sources: ../src/mips_rom.vhd

          - name: RAM
            toplevel: mips_ram
            module: test_mips_ram
            sources: ../src/mips_ram.vhd

          - name: Toplevel
            toplevel: mips_word_toplevel
            module: test_mips_word_toplevel
            sources: ../src/ula.vhd ../src/reg_file.vhd ../src/sign_extender.vhd ../src/pc_register.vhd ../src/mips_decoder.vhd ../src/mips_rom.vhd ../src/mips_ram.vhd ../src/mips_word_toplevel.vhd

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run cocotb test (${{ matrix.name }})
        run: |
          make -C /var/www/test/ \
            TOPLEVEL=${{ matrix.toplevel }} \
            MODULE=${{ matrix.module }} \
            VHDL_SOURCES="${{ matrix.sources }}"
